<center>

<h3>Identification</h3>

<p>
Veuillez entrer votre identifiant :
</p>

<input type="text" id="identifiant" size="30">

<p>
<input type="button" value="Continuer" onclick="chercherQuestion()">
</p>

<p id="question"></p>
</p>

</center>

<hr>

<p>
<a href="irc.html">
← Retour à la page IRC
</a>
</p>

Optimisé pour Netscape Navigator 3.0
</p>

  <script>

function chercherQuestion() {

    var identifiant = document.getElementById("identifiant").value.toLowerCase();

    if (identifiant == "ashley") {

        document.getElementById("question").innerHTML =
        "Quel est le nom de votre maison ?";

    }

    else if (identifiant == "morgan") {

        document.getElementById("question").innerHTML =
        "Dans quel département étudiez-vous ?";

    }

    else if (identifiant == "emily") {

        document.getElementById("question").innerHTML =
        "Quel est votre domaine d'étude ?";

    }

    else {

        document.getElementById("question").innerHTML =
        "Identifiant inconnu.";

    }

}

</script>

  <p id="question"></p>

<input type="text" id="reponse" size="30">

<p>
<input type="button" value="Valider" onclick="verifierReponse()">
</p>

<script>

function verifierReponse() {

    var identifiant =
    document.getElementById("identifiant").value.toLowerCase();

    var reponse =
    document.getElementById("reponse").value.toLowerCase();


    if (identifiant == "ashley" && reponse == "pi") {

        window.location.href = "irc_ashley.html";

    }

    else if (identifiant == "morgan" && reponse == "commerce") {

        window.location.href = "irc_morgan.html";

    }

    else if (identifiant == "emily" && reponse == "histoire") {

        window.location.href = "irc_emily.html";

    }

    else {

        alert("Réponse incorrecte.");

    }

}

</script>
</body>

</html>
